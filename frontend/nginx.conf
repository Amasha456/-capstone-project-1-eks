server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # In docker-compose, "backend" resolves via the compose network.
  # In Kubernetes, this whole block is replaced by an Ingress resource instead.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
