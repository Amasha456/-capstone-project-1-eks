name: Build and Deploy to EKS

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 448049824779.dkr.ecr.eu-central-1.amazonaws.com
  EKS_CLUSTER: capstone-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t $ECR_REGISTRY/todo-backend:${{ github.sha }} -t $ECR_REGISTRY/todo-backend:latest ./backend
          docker push $ECR_REGISTRY/todo-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/todo-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t $ECR_REGISTRY/todo-frontend:${{ github.sha }} -t $ECR_REGISTRY/todo-frontend:latest ./frontend
          docker push $ECR_REGISTRY/todo-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/todo-frontend:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy manifests
        run: kubectl apply -f k8s/

      - name: Roll out new images
        run: |
          kubectl set image deployment/backend backend=$ECR_REGISTRY/todo-backend:${{ github.sha }}
          kubectl set image deployment/frontend frontend=$ECR_REGISTRY/todo-frontend:${{ github.sha }}

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s
